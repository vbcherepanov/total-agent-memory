name: release-install-matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build candidate artifacts in Docker
        run: |
          docker build -f docker/Dockerfile.dev -t tam-release-dev .
          docker run --rm -v "$PWD:/workspace" tam-release-dev python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-package
          path: dist/*
          if-no-files-found: error

  native:
    needs: package
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.tam-models
      TAM_INDEX_MEDIA_MODEL_CACHE: ${{ github.workspace }}/.tam-models/whisper
      TAM_MEMORY_DIR: ${{ github.workspace }}/.tam-test-memory
      MEMORY_LLM_ENABLED: 'false'
      MEMORY_MODE: fast
      MEMORY_EMBED_THREADS: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-package
          path: dist
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: tam-models-v15-${{ runner.os }}-${{ runner.arch }}
      # Hosted interpreters ship their own tools (pipx on windows-2022 / 3.12),
      # whose pins make `pip check` fail for reasons unrelated to the candidate.
      - name: Create an isolated environment for the candidate
        run: |
          python -m venv "$RUNNER_TEMP/tam-candidate"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$RUNNER_TEMP/tam-candidate/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/tam-candidate/bin" >> "$GITHUB_PATH"
          fi
      - name: Install exact candidate wheel
        run: |
          python -c "import sys; assert sys.prefix != sys.base_prefix, sys.prefix"
          for wheel in dist/*.whl; do
            python -m pip install "${wheel}[media]" pytest
          done
          python -m pip check
      - name: Install OCR on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng
      - name: Install OCR on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install OCR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
          $ocrPath = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $ocrPath 'tesseract.exe'))) {
            throw 'Tesseract installation did not produce tesseract.exe'
          }
          $ocrPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Installed package, local and remote MCP, scopes, restart and restore
        run: python tests/smoke/installed_runtime.py
      - name: Native server regressions
        run: python -m pytest tests/test_team_memory.py tests/test_team_lifecycle.py tests/test_team_worker_reuse.py tests/test_windows_installer_runtime.py tests/test_store_windows_encoding.py tests/test_cpu_budget.py tests/test_grounded_answer.py -q --junitxml=native-results.xml
      - name: Recall concurrency, persistent watcher and real media regressions
        env:
          TAM_MEDIA_REQUIRED: '1'
          TAM_MEDIA_REAL_ASR: '1'
          TAM_INDEX_MEDIA_OCR_LANGUAGES: eng
        run: |
          tesseract --version
          python -m pytest tests/test_store_owner.py tests/test_recall_staging.py tests/test_rerank_batch.py tests/test_rerank_cache.py tests/test_resource_watcher.py tests/test_resource_media.py -q --junitxml=native-v15-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('native-v15-results.xml').getroot().findall('.//testcase')
          assert cases, 'Native v15 regression suite collected no tests'
          incomplete = [case.attrib.get('name') for case in cases
                        if any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error'))]
          assert not incomplete, f'Native v15 regressions must all execute and pass: {incomplete}'
          PY
      - name: Full source installation on Unix
        if: runner.os != 'Windows'
        run: bash install.sh --ide cursor
      - name: Source-installed entry points on Unix
        if: runner.os != 'Windows'
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python tests/smoke/installed_runtime.py
      - name: Full source installation on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\install.ps1 -Ide claude-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          & .\.venv\Scripts\python.exe tests/smoke/installed_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Platform service configuration
        if: runner.os != 'Windows'
        env:
          INSTALL_TEST_MODE: skip-heavy
        run: bash install.sh --ide claude-code
      - name: Installed background dashboard reports candidate release
        run: python tests/smoke/check_dashboard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            native-results.xml
            native-v15-results.xml

  compose:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build candidate image
        run: docker build -t tam-compose-candidate:15.0.1 .
      - name: Compose cold start, real MCP, restart and persistence
        env:
          TAM_TEAM_IMAGE: tam-compose-candidate:15.0.1
        run: bash tests/smoke/compose-candidate.sh

  browser:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-package
          path: dist
      - name: Build browser test environment
        run: |
          docker build -f docker/Dockerfile.dev -t tam-release-dev .
          docker build -f docker/Dockerfile.browser --build-arg DEVELOPMENT_IMAGE=tam-release-dev -t tam-release-browser .
      - name: Chromium, Firefox and WebKit against real server
        run: |
          docker run --rm --init --shm-size=1g -v "$PWD:/workspace" -w /workspace tam-release-browser sh -c \
            'python -m pip install --no-deps dist/*.whl && python -m pytest tests/browser -q --junitxml=browser-results.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: browser-results.xml

  source-archive:
    needs: package
    runs-on: ubuntu-24.04
    # 15.0.0 grew the suite to ~7000 tests: the ci test job alone takes ~28 min,
    # and this job also builds the dev image and prewarms models.
    timeout-minutes: 60
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.tam-models
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-package
          path: dist
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: tam-models-source-v14-${{ runner.os }}-${{ hashFiles('src/config.py') }}
      - name: Test the unpacked source distribution
        run: |
          docker build -f docker/Dockerfile.dev -t tam-release-dev .
          docker run --rm -v "$PWD:/workspace" -w /workspace -e FASTEMBED_CACHE_PATH=/workspace/.tam-models tam-release-dev sh -c \
            'set -eu; mkdir -p /tmp/source-candidate; tar -xzf dist/*.tar.gz --strip-components=1 -C /tmp/source-candidate; cd /tmp/source-candidate; python tests/smoke/prewarm_models.py; python -m pytest tests -q --junitxml=/workspace/source-results.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-results
          path: source-results.xml

  release-platform-gate:
    if: always()
    needs: [package, native, compose, browser, source-archive]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SOURCE_RESULT: ${{ needs.source-archive.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$SOURCE_RESULT" = success
