# Manual fallback for ~/.codex/config.toml. The installer
# (~/total-agent-memory/install.sh --ide codex) writes the
# [mcp_servers.memory] table for you; it registers no hooks.

# Optional — capture every finished Codex turn into the action log
# (and, with TAM_TURN_AUTOSAVE, a turn summary). `notify` is a top-level
# key: keep it above the first [table].
# notify = ["/path/to/total-agent-memory/hooks/codex-notify.sh"]

[mcp_servers.memory]
command = "total-agent-memory"
args = []

[mcp_servers.memory.env]
MEMORY_ASYNC_ENRICHMENT = "false"
MEMORY_QUALITY_GATE_ENABLED = "auto"
MEMORY_CONTRADICTION_DETECT_ENABLED = "auto"
