[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-agent-memory"
version = "14.10.0"
description = "Persistent local memory MCP server for Claude Code, Codex CLI, Cursor and any MCP client: 79 tools — temporal knowledge graph, procedural memory, episodic memory, AST codebase ingest, pre-edit guard, auto-consolidating error capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Vitalii Cherepanov", email = "vbcherepanov@gmail.com"},
]
keywords = ["mcp", "memory", "ai", "llm", "claude-code", "codex", "cursor", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.9,<3",
    "chromadb>=0.4.0",
    # The torch stack — sentence-transformers, transformers, FlagEmbedding,
    # peft — moved to the [rerank] extra. See the comment on that extra for
    # the measurement; nothing in the default configuration can reach it.

    # ingest_codebase() parses source with tree-sitter. Without this the
    # ingester silently degrades to whole-file chunks, which is not what the
    # README advertises — so it is a hard dependency, not an extra (2 MB wheel).
    "tree-sitter-language-pack>=1.13",
    # The default embedding backend. It was declared only in requirements.txt,
    # so install.sh and Docker users got it while every pip / uvx / npx / brew
    # user silently fell back to sentence-transformers with a different,
    # English-only model — so the two install paths did not retrieve alike.
    #
    # Note this is a *consistency* fix, not a memory one: measured on one
    # machine the fastembed path costs MORE resident memory (921 MB) than the
    # sentence-transformers fallback (565 MB), because the fastembed default is
    # the multilingual MiniLM-L12 and the fallback is the small English
    # MiniLM-L6. The ~1.5 GB users reported came from torch being imported
    # eagerly on top of the fastembed model, which is fixed separately.
    "fastembed>=0.6,<0.9",
    # HTTP transport (MCP_TRANSPORT=http) — a documented feature, so a declared
    # dependency rather than something inherited from mcp[cli] by luck.
    "starlette>=0.37",
    "uvicorn>=0.30",
    # Imported directly by src/ (binary search, provider HTTP calls). They
    # arrive transitively today; an upstream drop would break us silently.
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    # Russian stemming for the lexical recall tier: FTS5 unicode61 matches
    # exact word forms only, so "Маша" never met "Маше". Pure Python, BSD.
    "snowballstemmer>=2.2",
    # Team dashboard: provider API keys are stored Fernet-encrypted at rest.
    "cryptography>=42",
]

[project.optional-dependencies]
# The torch stack. Every import behind it is a fallback or an opt-in path:
#
#   sentence-transformers  the CrossEncoder reranker loader (src/reranker.py)
#                          and the embedding fallback in src/server.py
#   FlagEmbedding, peft    the FlagReranker path for BAAI/bge-reranker-v2-m3,
#                          tried only when CrossEncoder cannot load the model
#   transformers           pinned >=4.40 so the CrossEncoder loader wins over
#                          FlagEmbedding's tokenizer wrapper; also the NLI
#                          verifier, which only benchmarks/v11_pipeline.py calls
#
# It is an extra rather than a dependency because resolving it drags in torch
# and the whole nvidia-cu* stack. Measured with `uv pip compile` for
# x86_64-unknown-linux-gnu / py3.12, summing the wheels PyPI would serve:
#
#     with it     147 packages, ~3108 MB   (torch 529, cudnn 528, cublas 404,
#                                           triton 237, nccl 206, cufft 204 …)
#     without it   97 packages,  ~113 MB
#
# On a CPU host every one of those CUDA wheels is dead weight, and the Glama
# build sandbox died outright — "No space left on device" while unpacking
# nvidia-cudnn-cu13. Worse, the default configuration cannot reach any of it:
# MEMORY_MODE=fast sets MEMORY_RERANK_ENABLED=false and
# MEMORY_ALLOW_OLLAMA_IN_HOT_PATH=false, and the latter is exactly the gate
# that lets Recall._compute fall through to SentenceTransformer. So the base
# install shipped 3 GB for code paths its own defaults forbid.
#
# Turn the reranker on with MEMORY_MODE=deep (or MEMORY_RERANK_ENABLED=true)
# and install it with:  pip install "total-agent-memory[rerank]"
rerank = [
    "threadpoolctl>=3.6,<4",
    "sentence-transformers>=5,<6",
    "transformers>=4.40",
    "FlagEmbedding>=1.2.10",
    "peft>=0.7.0",
]
# PostgreSQL backend for the team server (tam-team). The personal install and the
# SQLite team backend never import it. PostgreSQL itself is external: the customer
# installs it with the vector extension available.
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
]
# Image OCR in the file watcher (src/ingestion/ocr.py) through Apple Vision.
# macOS only; elsewhere the extra resolves to nothing and OCR falls back to
# pytesseract when it is installed. The import is guarded, so a base install
# still runs: images are stored without their text.
ocr = [
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]
all = ["total-agent-memory[rerank]", "total-agent-memory[postgres]"]
# Test and lint toolchain for contributors and CI (mirrors requirements-dev.txt,
# minus the benchmark-only packages): pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.16.6",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://totalmemory.dev"
Documentation = "https://totalmemory.dev/docs"
Repository = "https://github.com/vbcherepanov/total-agent-memory"
Issues = "https://github.com/vbcherepanov/total-agent-memory/issues"

[project.scripts]
total-agent-memory = "total_agent_memory.server:main_sync"
tam = "total_agent_memory.server:main_sync"
tam-team = "total_agent_memory.team:main"
tam-remote = "total_agent_memory.remote:main"
tam-aml = "total_agent_memory.aml:main"
tam-lookup = "total_agent_memory.lookup:main"
lookup-memory = "total_agent_memory.lookup:main"
# Backward-compat aliases (v11.x users keep working; pip prints a
# DeprecationWarning on first `from claude_total_memory import ...`).
claude-total-memory = "claude_total_memory.server:main_sync"
ctm-lookup = "claude_total_memory.lookup:main"

# Pack the new ``total_agent_memory`` wrapper, the legacy
# ``claude_total_memory`` shim (kept so existing imports keep working with
# a DeprecationWarning) and the heavy ``src/`` runtime. Without ``src*``
# the wrapper falls over with ``Error: server.py not found`` because it
# resolves ``../src/server.py`` relative to itself, which only exists in a
# git checkout — that bug bit v11.2.1 in production.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "total_agent_memory*",
    "claude_total_memory*",
    "src*",
    "migrations*",
    # Runtime data resolved as ``Path(__file__).parent.parent / <dir>``. Left
    # out of the wheel until v13, so canonical tag normalisation and every
    # `memory_save(filter=...)` silently no-op'd on pip / uvx / docker
    # installs — the same class of bug as the missing migrations.
    "vocabularies*",
    "filters*",
]
exclude = [
    "tests*",
    "benchmarks*",
    "docs*",
    "scripts*",
]

# Ship non-Python sidecar files (SQL migrations, vocabularies, etc.)
# alongside the modules. Without this they vanish in the wheel and the
# server crashes on first migration.
[tool.setuptools.package-data]
migrations = ["*.sql", "postgres/**/*.sql"]
vocabularies = ["*.txt"]
filters = ["*.toml"]
src = [
    "**/*.sql",
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.txt",
    # Team dashboard assets (served by team_memory.dashboard; no build step).
    "team_memory/static/*.html",
    "team_memory/static/*.js",
    "team_memory/static/*.css",
    "team_memory/static/*.svg",
    # Inter and JetBrains Mono (SIL OFL 1.1), self-hosted so the CSP stays 'self'.
    "team_memory/static/fonts/*.woff2",
    "team_memory/static/fonts/*.txt",
    # Onboarding (learning) section assets.
    "team_memory/learning/static/*.js",
    "team_memory/learning/static/*.css",
    # Reports section assets.
    "team_memory/reports/static/*.js",
    "team_memory/reports/static/*.css",
    # Local dashboard's vendored browser libraries + their licenses (no CDN at runtime).
    "dashboard_static/*.js",
    "dashboard_static/vendor/*/*.js",
    "dashboard_static/vendor/*/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-timeout: a hung test fails with its name and stack instead of stalling a CI job until the job timeout.
timeout = 600
norecursedirs = ["backups", ".git", ".venv", "node_modules"]
markers = [
    "slow: heavy tests (network/model download); set RUN_RERANKER_SLOW=1 to enable",
    "postgres: needs a PostgreSQL server (--backend=postgres|both or TAM_TEST_PG_URL)",
    "eval: recall-quality floor gate on the frozen multilingual corpus; needs the default embedding model cached (tests/smoke/prewarm_models.py)",
    "quarantined(reason): known-flaky test excluded from the blocking CI jobs and run in the non-blocking quarantine job. The reason MUST name the root cause (or the open issue tracking it) and the date quarantined, e.g. quarantined(reason='races the enrichment thread on db.close, issue #123, 2026-10-13')",
    "platform_sensitive(reason): result depends on OS, filesystem or CPU numerics; runs everywhere but failures are reported separately. The reason MUST state which platform differs and why, e.g. platform_sensitive(reason='NTFS has no POSIX file modes')",
]

# Lint gate run by .github/workflows/ci.yml and scripts/check.sh.
#
# The selected rules are the ones that catch real defects without a
# style opinion: syntax errors (E9), broken comparisons (F63), misplaced
# statements (F7), undefined names (F82), and unused imports / variables
# (F401, F841), which hide dead code and missed refactors.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".claude", ".tam-models", ".tam-test-memory", "dist", "build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

# Ratchet list, measured 2026-10-13 with ruff 0.16.8. Each entry is a file
# that already violated the rule when the gate was introduced; every file not
# listed here is held to the full rule set. Remove an entry once its file is
# clean. Never add one: fix the new violation instead.
